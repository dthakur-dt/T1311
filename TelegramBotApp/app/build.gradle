plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.telegrambotapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.telegrambotapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // ---- Production signing ----
    // Keystore ko environment secrets se padho (GitHub Actions me set hoga).
    // Local me key.properties (gitignored) se bhi padh sakte hain.
    def keystoreFile = System.getenv("KEYSTORE_FILE") ?: rootProject.file("keystore.jks").path
    def keystorePass = System.getenv("KEYSTORE_PASSWORD") ?: "release"
    def keyAlias    = System.getenv("KEY_ALIAS") ?: "release"
    def keyPass     = System.getenv("KEY_PASSWORD") ?: keystorePass

    signingConfigs {
        release {
            storeFile file(keystoreFile)
            storePassword keystorePass
            keyAlias keyAlias
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release   // production signing
        }
    }

    // Device-specific (split) APKs — ABI ke hisaab se
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    // Split APK output me Android version major bhi add karo (device matching ke liye)
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                def abi = output.getFilters().find { it.filterType == "ABI" }?.identifier
                if (abi != null) {
                    output.outputFileName = "app-${abi}-v${variant.versionName}.apk"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Network: Retrofit + OkHttp for Telegram Bot API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines for async work
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
