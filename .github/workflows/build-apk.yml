# One-Click Builder: GitHub Actions se Android APK build + GitHub Releases pe upload
# Trigger: GitHub Actions pe "Run workflow" button  /  Telegram /build  /  WebApp button
# (sab workflow_dispatch se hota hai)

name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (jaise v1.0.0)'
        required: true
        default: 'v1.0.0'
      tag_existing:
        description: 'Kya existing release me add karna hai? (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Releases/APK upload karne ke liye

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Keystore ko GitHub Secrets se banakar use karo (production signing)
      - name: Decode keystore from secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TelegramBotApp/keystore.jks
          echo "keystore.jks created"

      - name: Grant execute permission for gradlew
        working-directory: TelegramBotApp
        run: chmod +x ./gradlew

      - name: Build signed release APKs (split by ABI)
        working-directory: TelegramBotApp
        env:
          KEYSTORE_FILE: /home/runner/work/T1311/T1311/TelegramBotApp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          echo "--- built APKs ---"
          ls -la app/build/outputs/apk/release/

      - name: Create / Update GitHub Release & upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          tag_existing: ${{ github.event.inputs.tag_existing }}
          name: Build ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            TelegramBotApp/app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Output APK file list
        run: echo "✅ Build complete! APKs GitHub Releases pe upload ho gaye."
