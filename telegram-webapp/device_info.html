<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Device Info - Smart Install</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--tg-theme-bg-color, #fff);
      --sec: var(--tg-theme-secondary-bg-color, #f1f1f1);
      --text: var(--tg-theme-text-color, #000);
      --hint: var(--tg-theme-hint-color, #999);
      --accent: var(--tg-theme-button-color, #229ED9);
      --accent-text: var(--tg-theme-button-text-color, #fff);
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 460px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .header .logo { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .header h1 { font-size: 18px; }
    .header p { font-size: 12px; color: var(--hint); }
    .card { background: var(--sec); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card .k { font-size: 12px; color: var(--hint); }
    .card .v { font-size: 14px; font-weight: 600; }
    .btn { width: 100%; background: var(--accent); color: var(--accent-text); border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; font-family: inherit; }
    .btn:active { transform: scale(.97); }
    .note { font-size: 12px; color: var(--hint); text-align: center; margin-top: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🤖</div>
    <div>
      <h1>Smart Install</h1>
      <p id="userLabel">Device info auto-detect</p>
    </div>
  </div>

  <div class="card"><span class="k">Device Brand</span><span class="v" id="devBrand">…</span></div>
  <div class="card"><span class="k">Device Model</span><span class="v" id="devModel">…</span></div>
  <div class="card"><span class="k">Android Version</span><span class="v" id="devAndroid">…</span></div>
  <div class="card"><span class="k">ABI / Arch</span><span class="v" id="devAbi">…</span></div>
  <div class="card"><span class="k">Screen</span><span class="v" id="devScreen">…</span></div>

  <button class="btn" id="sendBtn">📲 Saala APK link lein</button>
  <div class="note">Ye info aapke device se auto-detect hui hai. Button dabate hi bot sahi APK ka download link bhejega.</div>

  <script>
    const tg = window.Telegram?.WebApp;
    const UA = navigator.userAgent || '';

    function getAndroidVersion() {
      const m = UA.match(/Android\s([\d.]+)/);
      return m ? m[1] : 'Unknown';
    }
    function getModel() {
      let m = UA.match(/; ([\w\s\-]+) Build\//) || UA.match(/\(([^)]+)\)/);
      return m ? m[1].split(';').pop().trim() : 'Unknown';
    }
    function getBrand() {
      const mod = getModel().toLowerCase();
      const brands = ['samsung','xiaomi','redmi','oppo','vivo','realme','oneplus','motorola','lenovo','nokia','poco','infinix','tecno','google'];
      for (const b of brands) { if (mod.includes(b)) return b.charAt(0).toUpperCase()+b.slice(1); }
      return 'Android';
    }
    function getAbi() {
      if (UA.includes('arm64') || UA.includes('aarch64')) return 'arm64-v8a';
      if (UA.includes('x86_64')) return 'x86_64';
      if (UA.includes('armeabi-v7a')) return 'armeabi-v7a';
      return 'arm64-v8a';
    }
    function getScreen() {
      return screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio||1) + 'x';
    }

    document.getElementById('devBrand').textContent = getBrand();
    document.getElementById('devModel').textContent = getModel();
    document.getElementById('devAndroid').textContent = 'Android ' + getAndroidVersion();
    document.getElementById('devAbi').textContent = getAbi();
    document.getElementById('devScreen').textContent = getScreen();

    if (tg) {
      tg.ready(); tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) document.getElementById('userLabel').textContent = 'Hello, ' + user.first_name;
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
      const info = {
        brand: getBrand(),
        model: getModel(),
        android: getAndroidVersion(),
        abi: getAbi(),
        screen: getScreen()
      };
      if (tg) {
        tg.sendData('DEVICE:' + JSON.stringify(info)); // bot ko device info bhejo
      } else {
        document.getElementById('userLabel').textContent = 'DEVICE:' + JSON.stringify(info);
      }
    });
  </script>
</body>
</html>
